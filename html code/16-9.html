<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>16-9</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background-color: #f8f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: cyan;
            padding: 30px 25px;
            position: fixed;
            left: 0;
            top: 0;
        }

        .sidebar a {
            display: block;
            width: 125px;
            margin-bottom: 38px;
            padding: 8px 10px;

            text-align: center;
            font-size: 20px;

            color: black;
            text-decoration: none;

            border: 5px solid white;
            border-radius: 10px;
        }

        .sidebar a:hover {
            background-color: white;
        }

        /* Main Content */
        .main {
            margin-left: 250px;
            padding: 10px;
        }

        .main h1 {
            display: inline-block;
            margin: 0;
            padding: 2px 5px;

            background-color: rgb(82, 38, 244);
            color: black;
            font-size: 40px;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <a href="#">Home</a>

        <a href="#">About</a>

        <a href="#">Contact</a>

        <a href="#">Service</a>

    </div>


    <!-- Main Content -->
    <div class="main">

        <h1>This is my Block</h1>

    </div>

</body>

</html>
