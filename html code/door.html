<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door</title>
    <style>

        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }


        body, html{
            height: 100%;
            width: 100%;
            justify-content: center;
            align-items: center;
          
        }
        body{
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: aqua;
        }
        .doorbox{
            width: 200px;
            height: 300px;
            background: #3cd16e;
            overflow: hidden;
            transition: cubic-bezier(0.075, 0.82, 0.165, 1);
            
        }

        .doorbox:hover .door{
            transform: rotateY(90deg);
            transition: transform 2s ease;


        }
        .door{
            width: 100%;
            height: 100%;
            background: #ac3195;
            border: 5px solid #600641;
            position: relative;
        }
        .door .handle{
            width: 20px;
            height: 20px;
            background: #050505;
            border-radius: 50%;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }
        .greet{
            width: 100px;
            padding: 10px;
            background-color: lightblue;
            position: absolute;
            left: calc(50%-50px);
            transform: scale(1);
            background: linear-gradient(blue, white, blue);
            position: absolute;
            top: 50%;
            transition: all 1s linear 2.5s;

        }

       
    </style>

</head>
<body>

    <div class="doorbox"> 
        <div class="door"> Door
            <div class="handle">
                <div class="greet"> Welcome

                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
